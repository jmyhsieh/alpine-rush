  <style>
    :root {
      color-scheme: dark;

      --white: #f8fbff;
      --cyan: #4fd8ff;
      --orange: #e8552d;
      --gold: #f4b93d;
      --glass: rgba(226, 242, 255, .14);
      --glass-line: rgba(255, 255, 255, .28);
      --shadow: 0 3px 16px rgba(13, 42, 78, .35);

    canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }

    #hud {
      position: fixed;
      inset: 0;
      z-index: 5;
      pointer-events: none;
      color: var(--white);
      text-shadow: var(--shadow);
      opacity: 0;
      transition: opacity .35s ease;
    }
    #hud.visible { opacity: 1; }
    .hud-block { position: absolute; }
    #speed { left: max(22px, env(safe-area-inset-left)); top: max(18px, env(safe-area-inset-top)); }
    #speed-value { display: block; font-size: clamp(38px, 6vw, 64px); line-height: .8; font-weight: 900; font-style: italic; letter-spacing: -4px; }
    #speed-unit { display: block; margin: 8px 0 0 3px; font-size: 11px; font-weight: 800; letter-spacing: 3px; opacity: .84; }
    #score-panel { right: max(22px, env(safe-area-inset-right)); top: max(18px, env(safe-area-inset-top)); text-align: right; }
    #score-label, #distance-label { font-size: 10px; font-weight: 800; letter-spacing: 2.5px; opacity: .72; }
    #score-value { font-size: clamp(25px, 4.5vw, 44px); line-height: 1; font-weight: 900; letter-spacing: -1.5px; }
    #combo {
      min-height: 25px;
      margin-top: 7px;
      font-size: clamp(14px, 2.4vw, 22px);
      font-weight: 950;
      font-style: italic;
      letter-spacing: .5px;
      transform-origin: right center;
      opacity: 0;
      transition: opacity .18s;
    }
    #combo.active { opacity: 1; }
    #combo.pulse { animation: comboPulse .24s ease-out; }
    @keyframes comboPulse { 0% { transform: scale(.7); } 55% { transform: scale(1.28); } 100% { transform: scale(1); } }

    #distance { left: max(22px, env(safe-area-inset-left)); bottom: max(22px, env(safe-area-inset-bottom)); }
    #distance-value { display: block; margin-top: 3px; font-size: 23px; font-weight: 900; }
    #boost-wrap { right: max(22px, env(safe-area-inset-right)); bottom: max(22px, env(safe-area-inset-bottom)); width: 74px; height: 74px; opacity: .3; transition: opacity .2s, transform .2s; }
    #boost-wrap.active { opacity: 1; transform: scale(1.07); }
    #boost-wrap svg { width: 100%; height: 100%; filter: drop-shadow(0 3px 9px rgba(21,49,78,.45)); transform: rotate(-90deg); }
    #boost-track, #boost-arc { fill: none; stroke-width: 5; }
    #boost-track { stroke: rgba(255,255,255,.18); }
    #boost-arc { stroke: #ffd06a; stroke-linecap: round; stroke-dasharray: 188.5; stroke-dashoffset: 188.5; }
    #boost-icon { position: absolute; inset: 0; display: grid; place-items: center; font-size: 22px; transform: translateY(-1px); }
    #shield-badge {
      position: absolute;
      right: 11px;
      bottom: 82px;
      display: grid;
      place-items: center;
      width: 50px;
      height: 50px;
      border: 1px solid rgba(255,255,255,.35);
      border-radius: 50%;
      background: rgba(214,239,255,.16);
      backdrop-filter: blur(10px);
      font-size: 23px;
      opacity: 0;
      transform: scale(.6);
      transition: .25s ease;
    }
    #shield-badge.active { opacity: 1; transform: scale(1); }
    #fps { right: 16px; bottom: 8px; font: 700 11px/1 ui-monospace, monospace; opacity: .75; display: none; }

    #popup-layer { position: fixed; inset: 0; z-index: 7; pointer-events: none; overflow: hidden; }
    .popup {
      position: absolute;
      left: 50%;
      top: 64%;
      transform: translate(-50%, 0) scale(.88);
      max-width: 92vw;
      color: white;
      font-size: clamp(22px, 4vw, 42px);
      font-style: italic;
      font-weight: 950;
      text-align: center;
      letter-spacing: -1px;
      text-shadow: 0 4px 18px rgba(13,36,69,.65);
      white-space: nowrap;
      animation: popupRise 1.35s cubic-bezier(.16,.84,.35,1) forwards;
    }
    .popup small { display: block; margin-top: 4px; font-size: .38em; font-style: normal; letter-spacing: 2px; }
    .popup.bad { color: #ff5b4f; }
    .popup.good { color: #87e8ff; }
    .popup.gold { color: #ffd06a; }
    @keyframes popupRise {
      0% { opacity: 0; transform: translate(-50%, 20px) scale(.68); }
      14% { opacity: 1; transform: translate(-50%, 0) scale(1.13); }
      72% { opacity: 1; transform: translate(-50%, -34px) scale(1); }
      100% { opacity: 0; transform: translate(-50%, -74px) scale(.94); }
    }

    #overlay {
      position: fixed;
      inset: 0;
      z-index: 20;
      display: grid;
      place-items: center;
      padding: max(24px, env(safe-area-inset-top)) max(24px, env(safe-area-inset-right)) max(24px, env(safe-area-inset-bottom)) max(24px, env(safe-area-inset-left));
      overflow-y: auto;
      color: white;
      background:

        linear-gradient(180deg, rgba(46,111,209,.48), rgba(191,219,247,.34));
      transition: opacity .5s ease, visibility .5s;
      cursor: pointer;
    }
    #overlay::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, rgba(13,47,94,.02), rgba(13,47,94,.18));
      pointer-events: none;
    }
    #overlay.hidden { opacity: 0; visibility: hidden; pointer-events: none; }
    #menu-card { position: relative; z-index: 1; width: min(920px, 100%); text-align: center; }
    #eyebrow { font-size: 11px; font-weight: 850; letter-spacing: 5px; opacity: .8; }

    h1 span { color: var(--orange); }
    #subtitle { margin: 22px auto 0; max-width: 620px; font-size: clamp(14px, 2vw, 20px); font-weight: 650; letter-spacing: .8px; opacity: .92; }
    #result { display: none; margin: 24px auto 0; }
    #result.visible { display: flex; justify-content: center; gap: clamp(28px, 7vw, 74px); }
    .result-cell span { display: block; font-size: 10px; font-weight: 850; letter-spacing: 3px; opacity: .7; }
    .result-cell b { display: block; margin-top: 4px; font-size: clamp(24px, 4vw, 40px); font-style: italic; }
    #hints { display: flex; justify-content: center; flex-wrap: wrap; gap: 8px; margin: 34px auto 0; }
    .hint {
      display: flex;
      align-items: center;
      gap: 8px;
      min-height: 40px;
      padding: 7px 13px;
      border: 1px solid var(--glass-line);
      border-radius: 999px;
      background: var(--glass);
      box-shadow: inset 0 1px rgba(255,255,255,.18), 0 8px 28px rgba(20,54,94,.12);
      backdrop-filter: blur(12px);
      font-size: 11px;
      font-weight: 750;
      letter-spacing: .4px;
    }
    .key { min-width: 26px; padding: 5px 7px; border-radius: 7px; background: rgba(255,255,255,.2); box-shadow: inset 0 1px rgba(255,255,255,.2); font-weight: 900; }

    #touch-ui { position: fixed; inset: 0; z-index: 10; pointer-events: none; display: none; }
    .touch-button {
      position: absolute;
      bottom: max(22px, env(safe-area-inset-bottom));
      display: grid;
      place-items: center;
      width: 78px;
      height: 78px;
      border: 1px solid rgba(255,255,255,.38);
      border-radius: 50%;
      color: white;
      background: rgba(214,239,255,.17);
      box-shadow: inset 0 1px rgba(255,255,255,.25), 0 8px 30px rgba(9,38,76,.25);
      backdrop-filter: blur(12px);
      font: 900 11px/1 inherit;
      letter-spacing: 1px;
      pointer-events: auto;

    #spin-button { right: max(18px, env(safe-area-inset-right)); }
    #rotate-hint { position: fixed; inset: 0; z-index: 40; display: none; place-items: center; padding: 30px; color: white; background: #2e6fd1; text-align: center; font-weight: 850; letter-spacing: 1px; }
    #rotate-hint b { display: block; margin-bottom: 15px; font-size: 42px; }

    #error-box {
      position: fixed;
      left: 10px;
      right: 10px;
      bottom: 10px;
      z-index: 100;
      display: none;
      max-height: 35vh;
      overflow: auto;
      padding: 12px 15px;
      border: 1px solid rgba(255,90,82,.75);
      border-radius: 10px;
      color: #fff;
      background: rgba(82,13,13,.9);
      font: 12px/1.45 ui-monospace, SFMono-Regular, Menlo, monospace;
      user-select: text;
      -webkit-user-select: text;
    }

    @media (pointer: coarse) { #touch-ui { display: block; } #hints { display: none; } }
    @media (orientation: portrait) and (pointer: coarse) { #rotate-hint { display: grid; } }
    @media (max-height: 620px) { h1 { font-size: clamp(54px, 15vh, 92px); } #hints { margin-top: 20px; } #ride-cta { margin-top: 22px; } }
    @media (prefers-reduced-motion: reduce) { #ride-cta { animation: none; } }
  </style>

  <div id="hud" aria-hidden="true">

      <div id="boost-icon">⚡</div><div id="shield-badge">✦</div>
    </div>
    <div id="fps" class="hud-block">60 FPS</div>
  </div>

  <div id="popup-layer" aria-live="polite"></div>

  <div id="overlay" role="button" tabindex="0" aria-label="Start ALPINE RUSH">
    <div id="menu-card">
      <div id="eyebrow">ENDLESS ALPINE FREERIDE</div>
      <h1>ALPINE <span>RUSH</span></h1>
      <div id="subtitle">Carve the fall line. Send every kicker. Chase one more gate.</div>
      <div id="result">
        <div class="result-cell"><span>SCORE</span><b id="result-score">0</b></div>
        <div class="result-cell"><span>BEST</span><b id="result-best">0</b></div>
        <div class="result-cell"><span>DISTANCE</span><b id="result-distance">0 m</b></div>
      </div>
      <div id="hints">
        <div class="hint"><span class="key">A D</span> CARVE</div>
        <div class="hint"><span class="key">W</span> TUCK</div>
        <div class="hint"><span class="key">SPACE</span> POP</div>
        <div class="hint"><span class="key">Q E</span> SPIN</div>
        <div class="hint"><span class="key">S</span> GRAB</div>
        <div class="hint"><span class="key">R</span> RESET</div>
      </div>
      <div id="ride-cta">CLICK TO RIDE</div>
    </div>
  </div>

  <div id="touch-ui" aria-hidden="true">
    <button id="jump-button" class="touch-button" type="button">JUMP</button>
    <button id="spin-button" class="touch-button" type="button">SPIN</button>
  </div>
  <div id="rotate-hint"><div><b>↻</b>Rotate your phone for the full mountain.</div></div>
  <pre id="error-box"></pre>

  <script>
    (() => {
      const report = value => {
        const box = document.getElementById('error-box');
        if (!box) return;
        box.style.display = 'block';
        box.textContent = `ALPINE RUSH ERROR\n${value}`;
      };
      window.__ALPINE_REPORT_ERROR__ = report;
      addEventListener('error', event => report(event.error?.stack || event.message || 'Module failed to load'));
      addEventListener('unhandledrejection', event => report(event.reason?.stack || String(event.reason)));
    })();
  </script>

        this.seed = seed;
        this.minIndex = -CONFIG.track.initialBehind;
        this.points = [];
        this.phase = -1.1;
        this.wave = 184;
        this.waveTarget = 184;
        this.amplitude = 31;
        this.amplitudeTarget = 31;
        this.grade = 16.5;
        this.gradeTarget = 16.5;
        this.gradeRemaining = 9;
        this.rng = mulberry32(seed ^ 0xA17E51);
        this._dir = new THREE.Vector3();
        this._generateFirst();
        this.ensureZ(CONFIG.track.lazyAhead);
      }

      _generateFirst() {
        const z = this.minIndex * CONFIG.track.pointSpacing;
        this.points.push({ x: Math.sin(this.phase) * this.amplitude, y: 112, z });
      }

      _rollGrade() {
        const r = this.rng();
        if (r < CONFIG.track.flatChance) this.gradeTarget = CONFIG.track.flatGrade;
        else if (r < CONFIG.track.flatChance + CONFIG.track.steepChance) this.gradeTarget = CONFIG.track.steepGrade;
        else this.gradeTarget = randRange(this.rng, CONFIG.track.gradeMin, CONFIG.track.gradeMax);
        this.gradeRemaining = randInt(this.rng, CONFIG.track.gradeHoldMin, CONFIG.track.gradeHoldMax);
      }

      _appendPoint() {
        if (this.rng() < CONFIG.track.targetChance) {
          this.waveTarget = randRange(this.rng, CONFIG.track.wavelengthMin, CONFIG.track.wavelengthMax);
          this.amplitudeTarget = randRange(this.rng, CONFIG.track.amplitudeMin, CONFIG.track.amplitudeMax);
        }
        this.wave = lerp(this.wave, this.waveTarget, CONFIG.track.targetSmooth);
        this.amplitude = lerp(this.amplitude, this.amplitudeTarget, CONFIG.track.targetSmooth);
        if (--this.gradeRemaining <= 0) this._rollGrade();
        this.grade = lerp(this.grade, this.gradeTarget, CONFIG.track.gradeSmooth);

        const previous = this.points[this.points.length - 1];
        const z = previous.z + CONFIG.track.pointSpacing;
        this.phase += TAU * CONFIG.track.pointSpacing / this.wave;
        const drift = fbm(z * 0.0024, 17.3, this.seed + 410) * 4.5;
        const x = Math.sin(this.phase) * this.amplitude + drift;
        const horizontal = Math.hypot(CONFIG.track.pointSpacing, x - previous.x);
        const y = previous.y - Math.tan(this.grade * DEG) * horizontal;
        this.points.push({ x, y, z });
      }

      ensureZ(z) {
        const target = z + CONFIG.track.lazyAhead;
        while (this.points[this.points.length - 1].z < target) this._appendPoint();
      }

      _sampleIndex(z) {
        this.ensureZ(z);
        const raw = z / CONFIG.track.pointSpacing - this.minIndex;
        return { i: Math.floor(raw), t: raw - Math.floor(raw) };
      }

      _catmull(z, key) {
        const sample = this._sampleIndex(z);
        const i1 = clamp(sample.i, 1, this.points.length - 3);
        const p0 = this.points[i1 - 1][key], p1 = this.points[i1][key];
        const p2 = this.points[i1 + 1][key], p3 = this.points[i1 + 2][key];
        const t = sample.t, t2 = t * t, t3 = t2 * t;
        return 0.5 * ((2 * p1) + (-p0 + p2) * t +
          (2 * p0 - 5 * p1 + 4 * p2 - p3) * t2 +
          (-p0 + 3 * p1 - 3 * p2 + p3) * t3);
      }

      xAt(z) { return this._catmull(z, 'x'); }
      yAt(z) { return this._catmull(z, 'y'); }

      curvature(z) {
        const h = CONFIG.track.derivativeStep;
        const xm = this.xAt(z - h), x0 = this.xAt(z), xp = this.xAt(z + h);
        const first = (xp - xm) / (2 * h);
        const second = (xp - 2 * x0 + xm) / (h * h);
        return second / Math.pow(1 + first * first, 1.5);
      }

      dirAt(z, target = this._dir) {
        const h = CONFIG.track.derivativeStep;
        const x0 = this.xAt(z - h), x1 = this.xAt(z + h);
        const y0 = this.yAt(z - h), y1 = this.yAt(z + h);
        return target.set(x1 - x0, y1 - y0, 2 * h).normalize();
      }

      lateralFrame(z, center, side, direction) {
        this.dirAt(z, direction);
        center.set(this.xAt(z), this.yAt(z), z);
        side.set(direction.z, 0, -direction.x).normalize();
      }

      pruneBefore(z) {
        const keepGlobalIndex = Math.floor(z / CONFIG.track.pointSpacing) - 5;
        const remove = Math.min(this.points.length - 8, Math.max(0, keepGlobalIndex - this.minIndex));
        if (remove > 0) {
          this.points.splice(0, remove);
          this.minIndex += remove;
        }
      }
    }

    let track = new InfiniteTrack(CONFIG.seed);
    const kickerCache = new Map();
    const courseScratch = { s: 0, lateral: 0 };

    function courseCoords(x, z, target = courseScratch) {
      let s = z;
      const h = CONFIG.track.derivativeStep;
      for (let i = 0; i < 2; i++) {
        const cx = track.xAt(s);
        const xm = track.xAt(s - h), xp = track.xAt(s + h);
        const dx = (xp - xm) / (2 * h);
        const ddx = (xp - 2 * cx + xm) / (h * h);
        const f = (cx - x) * dx + (s - z);
        const fp = Math.max(1e-5, dx * dx + (cx - x) * ddx + 1);
        s -= f / fp;
      }
      const cx = track.xAt(s);
      const dx = (track.xAt(s + h) - track.xAt(s - h)) / (2 * h);
      const inv = 1 / Math.sqrt(1 + dx * dx);
      target.s = s;
      target.lateral = (x - cx) * inv + (z - s) * (-dx * inv);
      return target;
    }

    function chunkSeed(index, salt = 0) {
      return ((index * 0x9E3779B1) ^ CONFIG.seed ^ salt) >>> 0;
    }

    function generateKickers(chunkIndex) {
      const rng = mulberry32(chunkSeed(chunkIndex, 0x51C0A));
      let count = 0;
      const roll = rng();
      if (roll < CONFIG.terrain.kickerChunkChance2) count = 2;
      else if (roll < CONFIG.terrain.kickerChunkChance2 + CONFIG.terrain.kickerChunkChance1) count = 1;
      if (chunkIndex === 2) count = 1;
      if (chunkIndex < 2) count = 0;
      const kickers = [];
      for (let i = 0; i < count; i++) {
        const z = chunkIndex * CONFIG.terrain.chunkLength + (count === 2 ? 28 + i * 43 : randRange(rng, 38, 68));
        if (Math.abs(track.curvature(z)) > CONFIG.terrain.kickerCurveLimit && chunkIndex !== 2) continue;
        kickers.push({
          z,
          lateral: chunkIndex === 2 ? -2.5 : randRange(rng, -CONFIG.terrain.kickerLateral, CONFIG.terrain.kickerLateral),
          amp: chunkIndex === 2 ? 1.82 : randRange(rng, CONFIG.terrain.kickerAmpMin, CONFIG.terrain.kickerAmpMax),
          upSigma: chunkIndex === 2 ? 10.4 : randRange(rng, CONFIG.terrain.kickerUpSigmaMin, CONFIG.terrain.kickerUpSigmaMax),
          downSigma: chunkIndex === 2 ? 3.15 : randRange(rng, CONFIG.terrain.kickerDownSigmaMin, CONFIG.terrain.kickerDownSigmaMax),
          width: randRange(rng, 3.6, 5.4)
        });
      }
      return kickers;
    }

    function getKickers(chunkIndex) {
      let value = kickerCache.get(chunkIndex);
      if (!value) {
        value = generateKickers(chunkIndex);
        kickerCache.set(chunkIndex, value);
      }
      return value;
    }

    function kickerHeight(x, z, s, lateral) {
      const ci = Math.floor(s / CONFIG.terrain.chunkLength);
      let height = 0;
      for (let c = ci - 1; c <= ci + 1; c++) {
        const kickers = getKickers(c);
        for (let i = 0; i < kickers.length; i++) {
          const k = kickers[i];
          const dz = s - k.z;
          const sigmaZ = dz < 0 ? k.upSigma : k.downSigma;
          const dx = lateral - k.lateral;
          height += k.amp * Math.exp(-0.5 * (dz * dz / (sigmaZ * sigmaZ) + dx * dx / (k.width * k.width)));
        }
      }
      return height;
    }

    function heightAt(x, z) {
      track.ensureZ(z + 60);
      const course = courseCoords(x, z);
      const s = course.s;
      const lateral = course.lateral;
      const absLateral = Math.abs(lateral);
      const wallD = Math.max(0, absLateral - CONFIG.terrain.valleyStart);
      const wall = Math.min(CONFIG.terrain.valleyCap, wallD * wallD * CONFIG.terrain.valleyStrength);
      const bank = -clamp(track.curvature(s) * CONFIG.terrain.bankScale, -CONFIG.terrain.bankCap, CONFIG.terrain.bankCap) * lateral;
      const shortNoise = 0.72 + 0.28 * valueNoise2(s * 0.014, 8.1, CONFIG.seed + 81);
      const shortRoller = Math.sin(s * TAU / CONFIG.terrain.rollerShortLength + 0.6) * CONFIG.terrain.rollerShortAmp * shortNoise;
      const longRoller = Math.sin(s * TAU / CONFIG.terrain.rollerLongLength - 0.8) * CONFIG.terrain.rollerLongAmp;
      const groomMask = smoothstep(CONFIG.terrain.pisteHalf - 2, CONFIG.terrain.pisteHalf + 7, absLateral);
      const moguls = fbm(x * CONFIG.terrain.mogulScale, z * CONFIG.terrain.mogulScale, CONFIG.seed + 290) * CONFIG.terrain.mogulAmp * (0.055 + 0.945 * groomMask);
      return track.yAt(s) + wall + bank + shortRoller + longRoller + moguls + kickerHeight(x, z, s, lateral);
    }

    const normalScratch = { normal: new THREE.Vector3(), height: 0 };
    function getHeightAndNormal(x, z, target = normalScratch) {
      const e = CONFIG.terrain.normalEpsilon;
      const h = heightAt(x, z);
      const hx = heightAt(x + e, z) - heightAt(x - e, z);
      const hz = heightAt(x, z + e) - heightAt(x, z - e);
      target.height = h;
      target.normal.set(-hx / (2 * e), 1, -hz / (2 * e)).normalize();
      return target;
    }

    function nearGateLane(x, z, gates) {
      for (let i = 0; i < gates.length; i++) {
        const g = gates[i];
        if (Math.abs(z - g.z) < 8 && Math.abs(x - g.x) < 7.2) return true;
      }
      return false;
    }

    function createChunkPattern(chunkIndex) {
      const rng = mulberry32(chunkSeed(chunkIndex, 0xD3C07));
      const startZ = chunkIndex * CONFIG.terrain.chunkLength;
      const kickers = getKickers(chunkIndex);
      const gates = [];
      const forceIntroGates = chunkIndex === 1;
      if (kickers.length === 0 && (forceIntroGates || rng() < CONFIG.pickups.gateChance)) {
        const firstZ = startZ + 18;
        for (let i = 0; i < 3; i++) {
          const z = firstZ + i * CONFIG.pickups.gateSpacing;
          if (z >= startZ + CONFIG.terrain.chunkLength - 2) break;
          const lateral = (i % 2 === 0 ? -1 : 1) * CONFIG.pickups.gateOffset;
          gates.push({ x: track.xAt(z) + lateral, z, lateral, resolved: false });
        }
      }

      const trees = [[], [], []];
      const rocks = [];
      const logs = [];
      const bushes = [];
      const obstacles = [];

      for (let row = 0; row < 12; row++) {
        const z = startZ + 4 + row * 8.2 + randRange(rng, -2.4, 2.4);
        for (let sideSign = -1; sideSign <= 1; sideSign += 2) {
          for (let band = 0; band < 3; band++) {
            const lateral = sideSign * (22 + band * 15 + randRange(rng, 0, 10));
            const density = band === 0 ? CONFIG.decor.nearDensity : CONFIG.decor.farDensity;
            if (rng() > density) continue;
            const x = track.xAt(z) + lateral;
            const variant = randInt(rng, 0, 2);
            if (trees[variant].length >= CONFIG.decor.maxTreesPerVariant) continue;
            trees[variant].push({
              x, z, scale: randRange(rng, CONFIG.decor.treeScaleMin, CONFIG.decor.treeScaleMax),
              yaw: randRange(rng, 0, TAU), tiltX: randRange(rng, -0.035, 0.035), tiltZ: randRange(rng, -0.035, 0.035),
              obstacle: false
            });
          }
        }
      }

      if (rng() < CONFIG.decor.heroChance && chunkIndex > 0) {
        const z = startZ + randRange(rng, 22, 80);
        const sign = rng() < 0.5 ? -1 : 1;
        trees[2].push({ x: track.xAt(z) + sign * randRange(rng, 16.8, 18.8), z, scale: randRange(rng, 1.65, 2.15), yaw: rng() * TAU, tiltX: 0, tiltZ: 0, obstacle: false });
      }

      const rockCount = randInt(rng, 3, 8);
      for (let i = 0; i < rockCount; i++) {
        const z = startZ + randRange(rng, 4, 96);
        const sign = rng() < 0.5 ? -1 : 1;
        const lateral = sign * randRange(rng, 25, 66);
        rocks.push({ x: track.xAt(z) + lateral, z, scale: randRange(rng, 0.7, 1.65), yaw: rng() * TAU, obstacle: false });
      }

      const bushCount = randInt(rng, 12, CONFIG.decor.maxBushes);
      for (let i = 0; i < bushCount; i++) {
        const z = startZ + randRange(rng, 2, 98);
        const sign = rng() < 0.5 ? -1 : 1;
        bushes.push({ x: track.xAt(z) + sign * randRange(rng, 17, 31), z, scale: randRange(rng, 0.45, 1.2), yaw: rng() * TAU });
      }

      if (chunkIndex >= CONFIG.decor.obstacleStartChunk) {
        let obstacleCount = Math.min(CONFIG.decor.obstacleMax, Math.floor(1 + chunkIndex / CONFIG.decor.obstacleRampChunks));
        if (chunkIndex === 4) obstacleCount = 1;
        for (let i = 0; i < obstacleCount; i++) {
          const z = startZ + 20 + i * (62 / Math.max(1, obstacleCount - 1)) + randRange(rng, -7, 7);
          const lateral = randRange(rng, -12.5, 12.5);
          const x = track.xAt(z) + lateral;
          if (nearGateLane(x, z, gates)) continue;
          const variant = randInt(rng, 0, 2);
          const tree = { x, z, scale: randRange(rng, 1.05, 1.48), yaw: rng() * TAU, tiltX: 0, tiltZ: 0, obstacle: true };
          trees[variant].push(tree);
          obstacles.push({ type: 'tree', x, z, radius: 0.58 * tree.scale });
        }
      }

      if (chunkIndex > 4 && rng() < CONFIG.decor.pisteRockChance) {
        const z = startZ + randRange(rng, 20, 82);
        const x = track.xAt(z) + randRange(rng, -13, 13);
        if (!nearGateLane(x, z, gates)) {
          const rock = { x, z, scale: randRange(rng, 0.72, 1.22), yaw: rng() * TAU, obstacle: true };
          rocks.push(rock);
          obstacles.push({ type: 'rock', x, z, radius: 0.65 * rock.scale });
        }
      }

      if (chunkIndex > 5 && rng() < CONFIG.decor.logChance) {
        const z = startZ + randRange(rng, 28, 76);
        const x = track.xAt(z) + randRange(rng, -6.5, 6.5);
        if (!nearGateLane(x, z, gates)) {
          const yaw = Math.atan2(track.dirAt(z).x, track.dirAt(z).z) + Math.PI * 0.5 + randRange(rng, -0.16, 0.16);
          const log = { x, z, scale: randRange(rng, 0.86, 1.18), yaw };
          logs.push(log);
          obstacles.push({ type: 'log', x, z, halfWidth: 3.2 * log.scale, halfDepth: 0.45 * log.scale, yaw });
        }
      }

      const pickups = [];
      let pathType = chunkIndex % 3;
      if (chunkIndex === 0) pathType = 0;
      if (kickers.length) {
        const k = kickers[0];
        for (let i = 0; i < 9; i++) {
          const t = i / 8;
          const z = k.z - 13 + t * 31;
          const lateral = lerp(k.lateral - 1.5, k.lateral + 2.2, t);
          pickups.push({ type: 'orb', x: track.xAt(z) + lateral, z, lift: 1.3 + Math.sin(t * Math.PI) * 3.7 });
        }
      } else if (pathType === 0) {
        for (let i = 0; i < 8; i++) {
          const z = startZ + 12 + i * 10.5;
          pickups.push({ type: 'orb', x: track.xAt(z) + Math.sin(i * 0.9) * 4.5, z, lift: 1.3 });
        }
      } else if (pathType === 1) {
        for (let i = 0; i < 9; i++) {
          const t = i / 8;
          const z = startZ + 10 + t * 78;
          const sweep = lerp(-10, 10, t) * (track.curvature(startZ + 50) >= 0 ? 1 : -1);
          pickups.push({ type: 'orb', x: track.xAt(z) + sweep, z, lift: 1.3 + Math.sin(t * Math.PI) * 1.5 });
        }
      } else {
        for (let i = 0; i < 10; i++) {
          const z = startZ + 6 + i * 9.3;
          pickups.push({ type: 'orb', x: track.xAt(z) + (i % 2 ? 9 : -9), z, lift: 1.3 });
        }
      }

      if (chunkIndex === 3 || rng() < CONFIG.pickups.boostChance) {
        const z = startZ + 82;
        pickups.push({ type: 'boost', x: track.xAt(z), z, lift: 1.55 });
      }
      if (rng() < CONFIG.pickups.shieldChance) {
        const z = startZ + 62;
        pickups.push({ type: 'shield', x: track.xAt(z) - 3.5, z, lift: 1.55 });
      }

      return { chunkIndex, kickers, trees, rocks, logs, bushes, obstacles, pickups, gates };
    }

    function pruneKickerCache(centerChunk) {
      for (const key of kickerCache.keys()) {
        if (key < centerChunk - 16 || key > centerChunk + 20) kickerCache.delete(key);
      }
    }

    function prepareGeometry(geometry, color) {
      const g = geometry.index ? geometry.toNonIndexed() : geometry;
      if (g !== geometry) geometry.dispose();
      g.deleteAttribute('uv');
      g.computeVertexNormals();
      const count = g.getAttribute('position').count;
      const colors = new Float32Array(count * 3);
      const c = new THREE.Color(color);
      for (let i = 0; i < count; i++) {
        colors[i * 3] = c.r; colors[i * 3 + 1] = c.g; colors[i * 3 + 2] = c.b;
      }
      g.setAttribute('color', new THREE.BufferAttribute(colors, 3));
      return g;
    }

    function mergeColored(parts) {
      const merged = mergeGeometries(parts, false);
      if (!merged) throw new Error('Procedural geometry merge failed.');
      for (let i = 0; i < parts.length; i++) parts[i].dispose();
      merged.computeBoundingSphere();
      return merged;
    }

    function makePineGeometry(variant, lod) {
      const parts = [];
      const radial = lod === 0 ? 7 : lod === 1 ? 5 : 4;
      const tiers = lod === 2 ? 1 : variant + 2;
      const trunk = prepareGeometry(new THREE.CylinderGeometry(0.15, 0.22, 1.8, radial, 1), CONFIG.colors.trunk);
      trunk.translate(0, 0.9, 0); parts.push(trunk);
      for (let i = 0; i < tiers; i++) {
        const y = 1.25 + i * (lod === 2 ? 0 : 0.82);
        const radius = (1.15 - i * 0.14) * (1 + variant * 0.08);
        const height = lod === 2 ? 3.5 : 2.25;
        const green = prepareGeometry(new THREE.ConeGeometry(radius, height, radial, 1, false), i % 2 ? CONFIG.colors.pineMid : CONFIG.colors.pine);
        green.translate(0, y + height * 0.46, 0); parts.push(green);
        if (lod < 2) {
          const cap = prepareGeometry(new THREE.ConeGeometry(radius * 0.88, height * 0.46, radial, 1, true), CONFIG.colors.rockSnow);
          cap.translate(0, y + height * 0.70, 0); parts.push(cap);
        }
      }
      return mergeColored(parts);
    }

    function makeRockGeometry(lod) {
      const detail = lod === 0 ? 1 : 0;
      let g = new THREE.IcosahedronGeometry(1, detail).toNonIndexed();
      g.deleteAttribute('uv');
      const p = g.getAttribute('position');
      const rng = mulberry32(CONFIG.seed ^ (lod * 7919) ^ 0xB0C);
      for (let i = 0; i < p.count; i++) {
        const scale = 0.82 + rng() * 0.31;
        p.setXYZ(i, p.getX(i) * scale, p.getY(i) * scale * 0.72, p.getZ(i) * scale);
      }
      p.needsUpdate = true; g.computeVertexNormals();
      const n = g.getAttribute('normal');
      const colors = new Float32Array(p.count * 3);
      const rock = new THREE.Color(CONFIG.colors.rock), snow = new THREE.Color(CONFIG.colors.rockSnow);
      for (let i = 0; i < p.count; i += 3) {
        const snowy = (n.getY(i) + n.getY(i + 1) + n.getY(i + 2)) / 3 > 0.48;
        const c = snowy ? snow : rock;
        const jitter = 0.82 + hash2(i, lod, CONFIG.seed + 330) * 0.24;
        for (let k = 0; k < 3; k++) {
          colors[(i + k) * 3] = c.r * jitter; colors[(i + k) * 3 + 1] = c.g * jitter; colors[(i + k) * 3 + 2] = c.b * jitter;
        }
      }
      g.setAttribute('color', new THREE.BufferAttribute(colors, 3));
      return g;
    }

    function makeLogGeometry(lod) {
      const radial = lod === 0 ? 8 : 5;
      const parts = [];
      const log = prepareGeometry(new THREE.CylinderGeometry(0.34, 0.38, 5.8, radial, 1, false), CONFIG.colors.trunk);
      log.rotateZ(Math.PI * 0.5); log.translate(0, 0.38, 0); parts.push(log);
      if (lod < 2) {
        const snow = prepareGeometry(new THREE.BoxGeometry(5.4, 0.10, 0.42), CONFIG.colors.rockSnow);
        snow.translate(0, 0.69, 0); parts.push(snow);
      }
      return mergeColored(parts);
    }

    function makeBushGeometry(lod) {
      const parts = [];
      const count = lod === 0 ? 3 : 1;
      for (let i = 0; i < count; i++) {
        const g = prepareGeometry(new THREE.IcosahedronGeometry(0.52 - i * 0.06, 0), i === 2 ? CONFIG.colors.snowShadow : CONFIG.colors.rockSnow);
        g.scale(1.2, 0.55, 1); g.translate((i - 1) * 0.46, 0.28, (i % 2) * 0.22); parts.push(g);
      }
      return mergeColored(parts);
    }

    function makeFlagGeometry(color) {
      const pole = prepareGeometry(new THREE.CylinderGeometry(0.045, 0.055, 2.7, 6, 1), 0xF2F6FF);
      pole.translate(0, 1.35, 0);
      const flag = new THREE.BufferGeometry();
      flag.setAttribute('position', new THREE.Float32BufferAttribute([0, 2.62, 0, 0, 1.92, 0, 0.85, 2.38, 0], 3));
      flag.setAttribute('normal', new THREE.Float32BufferAttribute([0,0,1, 0,0,1, 0,0,1], 3));
      flag.setAttribute('color', new THREE.Float32BufferAttribute(new Array(9).fill(0), 3));
      const c = new THREE.Color(color), ca = flag.getAttribute('color');
      for (let i = 0; i < 3; i++) ca.setXYZ(i, c.r, c.g, c.b);
      return mergeColored([pole, flag]);
    }

    const renderer = new THREE.WebGLRenderer({ antialias: false, alpha: false, powerPreference: 'high-performance', stencil: false });
    renderer.setPixelRatio(Math.min(devicePixelRatio, IS_MOBILE ? CONFIG.renderer.mobilePixelRatio : CONFIG.renderer.desktopPixelRatio));
    renderer.setSize(innerWidth, innerHeight);
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = CONFIG.renderer.exposure;
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.shadowMap.autoUpdate = false;
    document.body.prepend(renderer.domElement);

    const scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(CONFIG.colors ? CONFIG.renderer.fogColor : 0xC9DDF2, CONFIG.renderer.fogDensity);
    const camera = new THREE.PerspectiveCamera(CONFIG.camera.fovMin, innerWidth / innerHeight, 0.1, 1800);
    const cameraVelocity = new THREE.Vector3();
    const cameraLook = new THREE.Vector3();
    const cameraTarget = new THREE.Vector3();
    const cameraHeading = new THREE.Vector3(0, 0, 1);
    scene.add(camera);

    const hemi = new THREE.HemisphereLight(0xCFE8FF, 0x6C87A1, 1.55);
    scene.add(hemi);
    const sunLight = new THREE.DirectionalLight(0xFFE2B1, 3.2);
    sunLight.castShadow = true;
    sunLight.shadow.mapSize.set(IS_MOBILE ? CONFIG.renderer.shadowMobile : CONFIG.renderer.shadowDesktop, IS_MOBILE ? CONFIG.renderer.shadowMobile : CONFIG.renderer.shadowDesktop);
    sunLight.shadow.camera.left = sunLight.shadow.camera.bottom = -CONFIG.renderer.shadowBox * 0.5;
    sunLight.shadow.camera.right = sunLight.shadow.camera.top = CONFIG.renderer.shadowBox * 0.5;
    sunLight.shadow.camera.near = 0.1; sunLight.shadow.camera.far = 130;
    sunLight.shadow.bias = -0.00012; sunLight.shadow.normalBias = 0.025;
    scene.add(sunLight, sunLight.target);
    const sunDirection = new THREE.Vector3(-0.46, Math.sin(18 * DEG), 0.82).normalize();

    const skyUniforms = { sunDirection: { value: sunDirection.clone() } };
    const sky = new THREE.Mesh(
      new THREE.SphereGeometry(900, 32, 18),
      new THREE.ShaderMaterial({
        side: THREE.BackSide, depthWrite: false, fog: false, uniforms: skyUniforms,
        vertexShader: `varying vec3 vWorld; void main(){ vec4 w=modelMatrix*vec4(position,1.0); vWorld=w.xyz; gl_Position=projectionMatrix*viewMatrix*w; }`,
        fragmentShader: `
          uniform vec3 sunDirection; varying vec3 vWorld;
          void main(){
            vec3 ray=normalize(vWorld-cameraPosition);
            float horizon=pow(clamp(ray.y*.72+.30,0.0,1.0),.62);
            vec3 pale=vec3(.749,.859,.969), blue=vec3(.180,.435,.820);
            vec3 col=mix(pale,blue,horizon);
            float sunDot=max(dot(ray,sunDirection),0.0);
            float halo=pow(sunDot,32.0)*.45+pow(sunDot,220.0)*1.6;
            col+=vec3(1.0,.70,.38)*halo;
            gl_FragColor=vec4(col,1.0);
          }`
      })
    );
    sky.layers.set(2); scene.add(sky);

    function makeRadialTexture(stops, size = 128) {
      const canvas = document.createElement('canvas'); canvas.width = canvas.height = size;
      const ctx = canvas.getContext('2d');
      const gradient = ctx.createRadialGradient(size/2,size/2,0,size/2,size/2,size/2);
      for (let i = 0; i < stops.length; i++) gradient.addColorStop(stops[i][0], stops[i][1]);
      ctx.fillStyle = gradient; ctx.fillRect(0,0,size,size);
      const texture = new THREE.CanvasTexture(canvas); texture.colorSpace = THREE.SRGBColorSpace;
      return texture;
    }

    const sunTexture = makeRadialTexture([[0,'rgba(255,250,218,1)'],[.12,'rgba(255,234,171,1)'],[.3,'rgba(255,190,90,.45)'],[1,'rgba(255,174,66,0)']]);
    const sunSprite = new THREE.Sprite(new THREE.SpriteMaterial({ map: sunTexture, color: 0xFFF0C4, transparent: true, blending: THREE.AdditiveBlending, depthWrite: false, depthTest: true }));
    sunSprite.scale.set(36,36,1); sunSprite.layers.set(1); scene.add(sunSprite);
    const haloSprite = new THREE.Sprite(new THREE.SpriteMaterial({ map: sunTexture, color: 0xFFD18A, transparent: true, opacity: .46, blending: THREE.AdditiveBlending, depthWrite: false }));
    haloSprite.scale.set(78,78,1); haloSprite.layers.set(1); scene.add(haloSprite);

    const decorMaterial = new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 0.88, metalness: 0, flatShading: true });
    const snowMaterial = new THREE.MeshStandardMaterial({ color: CONFIG.colors.snow, vertexColors: true, roughness: CONFIG.terrain.snowRoughness, metalness: 0, flatShading: false });
    snowMaterial.extensions.derivatives = true;
    snowMaterial.onBeforeCompile = shader => {
      shader.vertexShader = shader.vertexShader
        .replace('#include <common>', `#include <common>\nattribute float lateral; varying float vLateral; varying vec3 vSnowWorld;`)
        .replace('#include <project_vertex>', `#include <project_vertex>\nvLateral=lateral; vSnowWorld=(modelMatrix*vec4(transformed,1.0)).xyz;`);
      shader.fragmentShader = shader.fragmentShader
        .replace('#include <common>', `#include <common>\nvarying float vLateral; varying vec3 vSnowWorld;\nfloat snowHash(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453123);}`)
        .replace('#include <color_fragment>', `#include <color_fragment>
          float piste=1.0-smoothstep(15.2,17.8,abs(vLateral));
          float aa=max(fwidth(vLateral*17.0),.06);
          float groove=1.0-smoothstep(.86-aa,.86+aa,abs(sin(vLateral*17.0)));
          float edgeBand=exp(-pow((abs(vLateral)-16.0)*.55,2.0));
          diffuseColor.rgb*=1.0-groove*piste*.055-edgeBand*.07;
          diffuseColor.rgb=mix(diffuseColor.rgb,diffuseColor.rgb*vec3(.87,.94,1.08),smoothstep(16.0,25.0,abs(vLateral))*.34);`)
        .replace('#include <normal_fragment_maps>', `#include <normal_fragment_maps>
          float pisteN=1.0-smoothstep(15.0,18.0,abs(vLateral));
          float cord=cos(vLateral*17.0)*.018*pisteN;
          float micro=(snowHash(floor(vSnowWorld.xz*5.0))-.5)*.026*(1.0-pisteN);
          normal=normalize(normal+mat3(viewMatrix)*vec3(cord,micro,-cord*.35));`)
        .replace('#include <lights_fragment_end>', `#include <lights_fragment_end>
          float halfLambert=dot(normal,vec3(.0,1.0,.0))*.5+.5;
          reflectedLight.indirectDiffuse+=vec3(.055,.105,.18)*(1.0-halfLambert);
          float cell=snowHash(floor(vSnowWorld.xz*10.0));
          float sparkle=step(.987,cell)*pow(max(dot(normal,normalize(vViewPosition)),0.0),110.0)*3.5;
          reflectedLight.directSpecular+=vec3(.72,.90,1.0)*sparkle;`);
      snowMaterial.userData.shader = shader;
    };
    snowMaterial.customProgramCacheKey = () => 'alpine-snow-r160-v3';

    const baseGeometries = {
      trees: [[], [], []], rocks: [], logs: [], bushes: []
    };
    for (let lod = 0; lod < 3; lod++) {
      for (let variant = 0; variant < 3; variant++) baseGeometries.trees[lod][variant] = makePineGeometry(variant, lod);
      baseGeometries.rocks[lod] = makeRockGeometry(lod);
      baseGeometries.logs[lod] = makeLogGeometry(lod);
      baseGeometries.bushes[lod] = makeBushGeometry(lod);
    }
    const redFlagGeometry = makeFlagGeometry(CONFIG.colors.redGate);
    const blueFlagGeometry = makeFlagGeometry(CONFIG.colors.blueGate);

    const LATERALS = [];
    for (let x = -CONFIG.terrain.worldHalf; x < -CONFIG.terrain.corridorHalf - 0.01; x += CONFIG.terrain.sparseSpacing) LATERALS.push(x);
    for (let x = -CONFIG.terrain.corridorHalf; x <= CONFIG.terrain.corridorHalf + 0.01; x += CONFIG.terrain.denseSpacing) LATERALS.push(Number(x.toFixed(4)));
    for (let x = CONFIG.terrain.corridorHalf + CONFIG.terrain.sparseSpacing; x < CONFIG.terrain.worldHalf; x += CONFIG.terrain.sparseSpacing) LATERALS.push(x);
    LATERALS.push(CONFIG.terrain.worldHalf);

    function makeTerrainGeometry() {
      const rows = CONFIG.terrain.rows, cols = LATERALS.length, count = rows * cols;
      const geometry = new THREE.BufferGeometry();
      const position = new THREE.BufferAttribute(new Float32Array(count * 3), 3).setUsage(THREE.DynamicDrawUsage);
      const normal = new THREE.BufferAttribute(new Float32Array(count * 3), 3).setUsage(THREE.DynamicDrawUsage);
      const color = new THREE.BufferAttribute(new Float32Array(count * 3), 3).setUsage(THREE.DynamicDrawUsage);
      const lateral = new THREE.BufferAttribute(new Float32Array(count), 1).setUsage(THREE.DynamicDrawUsage);
      const indices = new Uint32Array((rows - 1) * (cols - 1) * 6);
      let n = 0;
      for (let r = 0; r < rows - 1; r++) for (let c = 0; c < cols - 1; c++) {
        const a = r * cols + c, b = a + 1, d = (r + 1) * cols + c, e = d + 1;
        indices[n++] = a; indices[n++] = d; indices[n++] = b;
        indices[n++] = b; indices[n++] = d; indices[n++] = e;
      }
      geometry.setAttribute('position', position); geometry.setAttribute('normal', normal);
      geometry.setAttribute('color', color); geometry.setAttribute('lateral', lateral);
      geometry.setIndex(new THREE.BufferAttribute(indices, 1));
      geometry.boundingSphere = new THREE.Sphere(new THREE.Vector3(), 120);
      return geometry;
    }

    function makeInstanced(geometry, maxCount, castShadow = false) {
      const mesh = new THREE.InstancedMesh(geometry, decorMaterial, maxCount);
      mesh.count = 0; mesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
      mesh.castShadow = castShadow; mesh.receiveShadow = false; mesh.frustumCulled = false;
      return mesh;
    }

    const matrixScratch = new THREE.Matrix4();
    const quatScratch = new THREE.Quaternion();
    const scaleScratch = new THREE.Vector3();
    const posScratch = new THREE.Vector3();
    const eulerScratch = new THREE.Euler();
    const centerScratch = new THREE.Vector3();
    const sideScratch = new THREE.Vector3();
    const dirScratch = new THREE.Vector3();

    function setInstance(mesh, index, item, scaleFactor = 1) {
      const terrain = getHeightAndNormal(item.x, item.z);
      posScratch.set(item.x, terrain.height, item.z);
      eulerScratch.set(item.tiltX || 0, item.yaw || 0, item.tiltZ || 0, 'YXZ');
      quatScratch.setFromEuler(eulerScratch);
      const s = (item.scale || 1) * scaleFactor;
      scaleScratch.set(s, s, s);
      matrixScratch.compose(posScratch, quatScratch, scaleScratch);
      mesh.setMatrixAt(index, matrixScratch);
    }

    class ChunkSlot {
      constructor(slotIndex) {
        this.slotIndex = slotIndex;
        this.chunkIndex = Number.NaN;
        this.pattern = null;
        this.group = new THREE.Group();
        this.group.name = `chunk-slot-${slotIndex}`;
        this.terrain = new THREE.Mesh(makeTerrainGeometry(), snowMaterial);
        this.terrain.receiveShadow = true;
        this.terrain.castShadow = false;
        this.terrain.frustumCulled = false;
        this.group.add(this.terrain);
        this.lodGroups = [];
        this.lodMeshes = [];
        for (let lod = 0; lod < 3; lod++) {
          const group = new THREE.Group();
          const trees = [];
          for (let variant = 0; variant < 3; variant++) {
            const mesh = makeInstanced(baseGeometries.trees[lod][variant], CONFIG.decor.maxTreesPerVariant + CONFIG.decor.obstacleMax + 2, lod === 0);
            trees.push(mesh); group.add(mesh);
          }
          const rocks = makeInstanced(baseGeometries.rocks[lod], CONFIG.decor.maxRocks + 2, lod === 0);
          const logs = makeInstanced(baseGeometries.logs[lod], CONFIG.decor.maxLogs, lod === 0);
          const bushes = makeInstanced(baseGeometries.bushes[lod], CONFIG.decor.maxBushes, false);
          group.add(rocks, logs, bushes);
          this.lodGroups.push(group); this.lodMeshes.push({ trees, rocks, logs, bushes });
          this.group.add(group);
        }
        this.redFlags = makeInstanced(redFlagGeometry, 3, false);
        this.blueFlags = makeInstanced(blueFlagGeometry, 3, false);
        this.group.add(this.redFlags, this.blueFlags);
        scene.add(this.group);
      }

      assign(chunkIndex) {
        this.chunkIndex = chunkIndex;
        this.pattern = createChunkPattern(chunkIndex);
        this._buildTerrain();
        this._buildDecor();
        this._buildGates();
      }

      _buildTerrain() {
        const geometry = this.terrain.geometry;
        const positions = geometry.getAttribute('position');
        const normals = geometry.getAttribute('normal');
        const colors = geometry.getAttribute('color');
        const laterals = geometry.getAttribute('lateral');
        const rows = CONFIG.terrain.rows, cols = LATERALS.length;
        const startZ = this.chunkIndex * CONFIG.terrain.chunkLength;
        const snow = new THREE.Color(CONFIG.colors.snow);
        const shadow = new THREE.Color(CONFIG.colors.snowShadow);
        let vertex = 0;
        for (let r = 0; r < rows; r++) {
          const z = startZ + r * CONFIG.terrain.chunkLength / (rows - 1);
          track.lateralFrame(z, centerScratch, sideScratch, dirScratch);
          for (let c = 0; c < cols; c++, vertex++) {
            const lateral = LATERALS[c];
            const x = centerScratch.x + sideScratch.x * lateral;
            const worldZ = centerScratch.z + sideScratch.z * lateral;
            const sample = getHeightAndNormal(x, worldZ);
            positions.setXYZ(vertex, x, sample.height, worldZ);
            normals.setXYZ(vertex, sample.normal.x, sample.normal.y, sample.normal.z);
            laterals.setX(vertex, lateral);
            let ao = 0;
            for (let v = 0; v < 3; v++) {
              const list = this.pattern.trees[v];
              for (let i = 0; i < list.length; i++) {
                const dx = x - list[i].x, dz = worldZ - list[i].z;
                const d2 = dx * dx + dz * dz;
                if (d2 < 90) ao += Math.exp(-d2 / (2 * CONFIG.decor.aoRadius * CONFIG.decor.aoRadius)) * .15;
              }
            }
            for (let i = 0; i < this.pattern.rocks.length; i++) {
              const dx = x - this.pattern.rocks[i].x, dz = worldZ - this.pattern.rocks[i].z;
              const d2 = dx * dx + dz * dz;
              if (d2 < 70) ao += Math.exp(-d2 / 22) * .22;
            }
            ao = clamp(ao * CONFIG.decor.aoStrength, 0, .36);
            const off = smoothstep(16, 55, Math.abs(lateral)) * .12;
            colors.setXYZ(vertex,
              lerp(snow.r, shadow.r, ao + off * .45),
              lerp(snow.g, shadow.g, ao * .72 + off * .28),
              lerp(snow.b, shadow.b, ao * .38));
          }
        }
        positions.needsUpdate = normals.needsUpdate = colors.needsUpdate = laterals.needsUpdate = true;
        geometry.boundingSphere.center.set(track.xAt(startZ + 50), track.yAt(startZ + 50), startZ + 50);
        geometry.boundingSphere.radius = 128;
      }

      _fillMesh(mesh, items, scaleFactor = 1) {
        const count = Math.min(mesh.instanceMatrix.count, items.length);
        mesh.count = count;
        for (let i = 0; i < count; i++) setInstance(mesh, i, items[i], scaleFactor);
        mesh.instanceMatrix.needsUpdate = true;
        if (mesh.computeBoundingSphere) mesh.computeBoundingSphere();
      }

      _buildDecor() {
        for (let lod = 0; lod < 3; lod++) {
          const meshes = this.lodMeshes[lod];
          for (let variant = 0; variant < 3; variant++) this._fillMesh(meshes.trees[variant], this.pattern.trees[variant], lod === 2 ? 1.06 : 1);
          this._fillMesh(meshes.rocks, this.pattern.rocks, lod === 2 ? .96 : 1);
          this._fillMesh(meshes.logs, this.pattern.logs, 1);
          this._fillMesh(meshes.bushes, this.pattern.bushes, lod === 2 ? .8 : 1);
        }
      }

      _buildGates() {
        const redItems = [], blueItems = [];
        for (let i = 0; i < this.pattern.gates.length; i++) {
          const gate = this.pattern.gates[i];
          track.lateralFrame(gate.z, centerScratch, sideScratch, dirScratch);
          const yaw = Math.atan2(dirScratch.x, dirScratch.z);
          redItems.push({ x: gate.x - sideScratch.x * CONFIG.pickups.gateWidth * .5, z: gate.z - sideScratch.z * CONFIG.pickups.gateWidth * .5, yaw, scale: 1 });
          blueItems.push({ x: gate.x + sideScratch.x * CONFIG.pickups.gateWidth * .5, z: gate.z + sideScratch.z * CONFIG.pickups.gateWidth * .5, yaw, scale: 1 });
        }
        this._fillMesh(this.redFlags, redItems); this._fillMesh(this.blueFlags, blueItems);
      }

      updateLod(cameraPosition) {
        const zCenter = this.chunkIndex * CONFIG.terrain.chunkLength + 50;
        const dx = cameraPosition.x - track.xAt(zCenter), dz = cameraPosition.z - zCenter;
        const distance = Math.hypot(dx, dz);
        const lod = distance < CONFIG.decor.fullLod ? 0 : distance < CONFIG.decor.mediumLod ? 1 : 2;
        for (let i = 0; i < 3; i++) this.lodGroups[i].visible = i === lod;
        this.lodMeshes[lod].bushes.visible = lod === 0;
        this.redFlags.visible = this.blueFlags.visible = distance < CONFIG.decor.mediumLod;
      }
    }

    let pickupSystem = null;

    class WorldStream {
      constructor() {
        this.slots = [];
        this.currentChunk = 0;
        this.rebuiltThisFrame = 0;
        const poolSize = CONFIG.terrain.ahead + CONFIG.terrain.behind + 1;
        for (let i = 0; i < poolSize; i++) this.slots.push(new ChunkSlot(i));
        for (let c = -CONFIG.terrain.behind, i = 0; c <= CONFIG.terrain.ahead; c++, i++) this.slots[i].assign(c);
      }

      update(z) {
        this.rebuiltThisFrame = 0;
        this.currentChunk = Math.floor(z / CONFIG.terrain.chunkLength);
        const min = this.currentChunk - CONFIG.terrain.behind;
        const max = this.currentChunk + CONFIG.terrain.ahead;
        let missing = null;
        for (let c = min; c <= max; c++) {
          let found = false;
          for (let i = 0; i < this.slots.length; i++) if (this.slots[i].chunkIndex === c) { found = true; break; }
          if (!found) { missing = c; break; }
        }
        if (missing !== null) {
          let candidate = null, farthest = -1;
          for (let i = 0; i < this.slots.length; i++) {
            const slot = this.slots[i];
            if (slot.chunkIndex >= min && slot.chunkIndex <= max) continue;
            const distance = Math.abs(slot.chunkIndex - this.currentChunk);
            if (distance > farthest) { farthest = distance; candidate = slot; }
          }
          if (candidate) {
            candidate.assign(missing);
            if (pickupSystem) pickupSystem.syncSlot(candidate);
            this.rebuiltThisFrame = 1;
          }
        }
        for (let i = 0; i < this.slots.length; i++) this.slots[i].updateLod(camera.position);
        pruneKickerCache(this.currentChunk);
        track.pruneBefore(z - 600);
      }

      forPatterns(callback) {
        for (let i = 0; i < this.slots.length; i++) if (this.slots[i].pattern) callback(this.slots[i].pattern, this.slots[i]);
      }

      activeIndices() {
        const out = [];
        for (let i = 0; i < this.slots.length; i++) out.push(this.slots[i].chunkIndex);
        return out.sort((a, b) => a - b);
      }
    }

    const world = new WorldStream();

    function meshWithMaterial(geometry, material, parent, position, scale, rotation) {
      const mesh = new THREE.Mesh(geometry, material);
      mesh.position.set(position[0], position[1], position[2]);
      mesh.scale.set(scale[0], scale[1], scale[2]);
      if (rotation) mesh.rotation.set(rotation[0], rotation[1], rotation[2]);
      mesh.castShadow = true; mesh.receiveShadow = false; parent.add(mesh); return mesh;
    }

    const riderMaterials = {
      board: new THREE.MeshStandardMaterial({ color: CONFIG.colors.orange, roughness: .62, flatShading: true }),
      jacket: new THREE.MeshStandardMaterial({ color: CONFIG.colors.jacket, roughness: .86, flatShading: true }),
      pants: new THREE.MeshStandardMaterial({ color: 0x263849, roughness: .88, flatShading: true }),
      boot: new THREE.MeshStandardMaterial({ color: 0x162431, roughness: .9, flatShading: true }),
      skin: new THREE.MeshStandardMaterial({ color: 0xE8B08D, roughness: .88, flatShading: true }),
      helmet: new THREE.MeshStandardMaterial({ color: CONFIG.colors.helmet, roughness: .68, flatShading: true }),
      goggles: new THREE.MeshStandardMaterial({ color: CONFIG.colors.goggles, roughness: .22, metalness: .12, flatShading: true, emissive: 0x063A69, emissiveIntensity: .28 })
    };

    function createRider() {
      const root = new THREE.Group(); root.name = 'rider-root';
      const boardTilt = new THREE.Group(); boardTilt.name = 'board-edge-tilt'; root.add(boardTilt);
      const character = new THREE.Group(); character.name = 'rider-character'; boardTilt.add(character);
      const boardGeometry = new THREE.CapsuleGeometry(.42, 2.65, 4, 10);
      boardGeometry.rotateX(Math.PI * .5);
      const board = meshWithMaterial(boardGeometry, riderMaterials.board, boardTilt, [0, .02, 0], [1, .10, 1.12]);
      board.name = 'rounded-snowboard';
      meshWithMaterial(new THREE.BoxGeometry(.42,.22,.7), riderMaterials.boot, character, [-.38,.38,-.34], [1,1,1], [0,.25,0]);
      meshWithMaterial(new THREE.BoxGeometry(.42,.22,.7), riderMaterials.boot, character, [.38,.38,.34], [1,1,1], [0,.25,0]);
      const leftLeg = new THREE.Group(), rightLeg = new THREE.Group();
      leftLeg.position.set(-.38,.48,-.30); rightLeg.position.set(.38,.48,.30); character.add(leftLeg,rightLeg);
      meshWithMaterial(new THREE.CapsuleGeometry(.12,.62,3,6), riderMaterials.pants, leftLeg, [0,.34,0], [1,1,1], [.28,0,-.16]);
      meshWithMaterial(new THREE.CapsuleGeometry(.12,.62,3,6), riderMaterials.pants, rightLeg, [0,.34,0], [1,1,1], [-.28,0,.16]);
      const torso = new THREE.Group(); torso.position.set(0,1.34,0); torso.rotation.y = -.38; character.add(torso);
      meshWithMaterial(new THREE.IcosahedronGeometry(.58,1), riderMaterials.jacket, torso, [0,.18,0], [.75,1.18,.66]);
      const armL = new THREE.Group(), armR = new THREE.Group();
      armL.position.set(-.48,.40,0); armR.position.set(.48,.40,0); torso.add(armL,armR);
      meshWithMaterial(new THREE.CapsuleGeometry(.09,.68,3,6), riderMaterials.jacket, armL, [-.18,-.1,0], [1,1,1], [0,0,-1.05]);
      meshWithMaterial(new THREE.CapsuleGeometry(.09,.68,3,6), riderMaterials.jacket, armR, [.18,-.1,0], [1,1,1], [0,0,1.05]);
      meshWithMaterial(new THREE.SphereGeometry(.105,8,5), riderMaterials.skin, armL, [-.48,-.42,0], [1,1,1]);
      meshWithMaterial(new THREE.SphereGeometry(.105,8,5), riderMaterials.skin, armR, [.48,-.42,0], [1,1,1]);
      const head = new THREE.Group(); head.position.set(0,.92,0); torso.add(head);
      meshWithMaterial(new THREE.SphereGeometry(.31,10,7), riderMaterials.helmet, head, [0,0,0], [1,1.03,1]);
      meshWithMaterial(new THREE.BoxGeometry(.55,.16,.10), riderMaterials.goggles, head, [0,.02,.27], [1,1,1], [-.08,0,0]);
      scene.add(root);
      root.traverse(object => { if (object.isMesh) object.castShadow = true; });
      return { root, boardTilt, character, torso, armL, armR, leftLeg, rightLeg, board };
    }

    const riderRig = createRider();
    const savedBest = (() => { try { return Number(localStorage.getItem(CONFIG.ui.bestKey)) || 0; } catch { return 0; } })();
    const state = {
      mode: 'MENU', ride: 'GROUNDED', time: 0, runTime: 0, accumulator: 0,
      score: 0, best: savedBest, distance: 0, startZ: 16, maxCourseZ: 16,
      boost: 0, shield: false, chain: 0, multiplier: 1, comboLeft: 0,
      frameMsEma: 16.7, slowSeconds: 0, qualityTier: 0,
      dofEnabled: !IS_MOBILE, godRaysEnabled: true, chroma: 0, boundary: 0,
      shake: 0, landingCompression: 0, wipeoutLeft: 0, eventCounter: 0,
      fpsVisible: false, fpsValue: 60, lastEvent: 'BOOT', events: [], paused: false
    };
    const rider = {
      position: new THREE.Vector3(), previous: new THREE.Vector3(), velocity: new THREE.Vector3(),
      yaw: 0, boardYaw: 0, edge: 0, grounded: true, groundHeight: 0, surfaceVy: 0,
      airTime: 0, spinAccum: 0, spinSign: 0, grabTime: 0, collisionGrace: 0,
      lowSpeedTime: 0, takeoffCooldown: 0, lateralSpeed: 0,
      tumbleAxis: new THREE.Vector3(1,0,0), tumbleAngle: 0,
      normal: new THREE.Vector3(0,1,0), targetQuaternion: new THREE.Quaternion()
    };
    const input = {
      keys: new Set(), steer: 0, tuck: false, spin: 0, grab: false,
      jumpQueued: false, touchSteer: 0, touchSpin: false, lastTouchSteer: 1,
      pointers: new Map()
    };
    let fxRng = mulberry32(CONFIG.seed ^ 0xF00DCAFE);

    function logEvent(type, detail = '') {
      state.lastEvent = detail ? `${type}:${detail}` : type;
      state.events.push({ t: Number(state.runTime.toFixed(2)), type, detail });
      if (state.events.length > 24) state.events.shift();
      dispatchEvent(new CustomEvent(`alpine:${type.toLowerCase()}`, { detail: { type, detail } }));
    }

    function makeStarGeometry() {
      const shape = new THREE.Shape();

    class PickupSystem {

      syncSlot(slot) {
        const base = slot.slotIndex * CONFIG.pickups.slotsPerChunk;
        for (let i = 0; i < CONFIG.pickups.slotsPerChunk; i++) {
          const record = this.records[base + i];
          const source = slot.pattern?.pickups[i];
          if (!source) { record.active = record.visible = false; continue; }
          record.active = record.visible = true; record.type = source.type;
          record.baseX = record.x = source.x; record.baseZ = record.z = source.z;
          record.lift = source.lift; record.y = heightAt(source.x, source.z) + source.lift;
          record.phase = hash2(slot.chunkIndex, i, CONFIG.seed + 708) * TAU;
          record.pop = 0; record.slot = slot.slotIndex; record.chunkIndex = slot.chunkIndex;

      update(dt) {

        for (let i = 0; i < this.records.length; i++) {

          const bob = Math.sin(state.time * CONFIG.pickups.bobSpeed + p.phase) * CONFIG.pickups.bobHeight;

        pickupMeshes.orb.instanceMatrix.needsUpdate = pickupMeshes.boost.instanceMatrix.needsUpdate = pickupMeshes.shield.instanceMatrix.needsUpdate = true;

    addEventListener('resize',resizeRendering,{passive:true});

    function deterministicSignature(firstChunk=0,count=10) {
      let hash=2166136261>>>0;const mix=value=>{const scaled=Math.round(value*1000)|0;hash^=scaled;hash=Math.imul(hash,16777619)>>>0;};
      for(let c=firstChunk;c<firstChunk+count;c++){const z=c*CONFIG.terrain.chunkLength+50;mix(track.xAt(z));mix(track.yAt(z));mix(track.curvature(z));const kickers=getKickers(c);mix(kickers.length);for(let i=0;i<kickers.length;i++){mix(kickers[i].z);mix(kickers[i].lateral);mix(kickers[i].amp);}}
      return hash.toString(16).padStart(8,'0');
    }
    function worldProbe(z,lateral=0){track.lateralFrame(z,centerScratch,sideScratch,dirScratch);const x=centerScratch.x+sideScratch.x*lateral,worldZ=z+sideScratch.z*lateral,sample=getHeightAndNormal(x,worldZ);return{x,y:sample.height,z:worldZ,lateral,normal:[sample.normal.x,sample.normal.y,sample.normal.z],curvature:track.curvature(z)};}
    function debugSnapshot(){const course=courseCoords(rider.position.x,rider.position.z);return{ready:true,gameState:state.mode,rideState:state.ride,seed:CONFIG.seed,rider:{position:[rider.position.x,rider.position.y,rider.position.z],speed:Math.hypot(rider.velocity.x,rider.velocity.z),lateral:course.lateral,yaw:rider.yaw,boardYaw:rider.boardYaw,edge:rider.edge,grounded:rider.grounded,airTime:rider.airTime,spin:rider.spinAccum,grab:rider.grabTime,grace:rider.collisionGrace},run:{score:state.score,best:state.best,distance:state.distance,chain:state.chain,multiplier:state.multiplier,comboLeft:state.comboLeft,boost:state.boost,shield:state.shield},stream:{activeChunks:world.activeIndices(),rebuiltThisFrame:world.rebuiltThisFrame,poolSize:world.slots.length,pickupSlots:pickupSystem.records.length},quality:{tier:state.qualityTier,dpr:renderer.getPixelRatio(),dof:state.dofEnabled,godRays:state.godRaysEnabled,frameMsEma:state.frameMsEma,drawCalls:renderer.info.render.calls,triangles:renderer.info.render.triangles},audio:{created:!!audio.context,state:audio.context?.state||'not-created',activeShots:audio.activeShots,lastShot:audio.lastShot},lastEvent:state.lastEvent,events:state.events.slice()};}

    const debugEnabled=new URLSearchParams(location.search).has('debug');
    const debugApi={snapshot:debugSnapshot,worldProbe,deterministicSignature};
    if(debugEnabled)Object.assign(debugApi,{pauseSimulation:value=>state.paused=!!value,step:(frames=1,dt=CONFIG.physics.fixedStep)=>{for(let i=0;i<frames;i++)physicsStep(dt);return debugSnapshot();},setInput:values=>{if(Number.isFinite(values.steer))input.touchSteer=clamp(values.steer,-1,1);if('tuck'in values){if(values.tuck)input.keys.add('KeyW');else input.keys.delete('KeyW');}if(Number.isFinite(values.spin)){input.touchSpin=values.spin!==0;input.lastTouchSteer=Math.sign(values.spin)||1;}if('grab'in values){if(values.grab)input.keys.add('KeyS');else input.keys.delete('KeyS');}},pulse:action=>{if(action==='jump')input.jumpQueued=true;else if(action==='respawn')respawn();},teleport:({distance=state.distance,lateral=0,heightOffset=0,speed=20,yawOffset=0}={})=>{const z=state.startZ+distance;track.lateralFrame(z,centerScratch,sideScratch,dirScratch);rider.position.set(centerScratch.x+sideScratch.x*lateral,heightAt(centerScratch.x+sideScratch.x*lateral,z+sideScratch.z*lateral)+CONFIG.physics.riderHeight+heightOffset,z+sideScratch.z*lateral);rider.yaw=Math.atan2(dirScratch.x,dirScratch.z)+yawOffset;rider.boardYaw=rider.yaw;rider.velocity.set(Math.sin(rider.yaw)*speed,0,Math.cos(rider.yaw)*speed);rider.grounded=heightOffset<=0;state.ride=rider.grounded?'GROUNDED':'AIRBORNE';world.update(rider.position.z);return debugSnapshot();},grant:kind=>{if(kind==='boost')state.boost=CONFIG.pickups.boostSeconds;else if(kind==='shield')state.shield=true;else award(CONFIG.pickups.orbScore,'ORB');return debugSnapshot();},collide:kind=>{fatalContact(kind);return debugSnapshot();},forceGate:outcome=>{if(outcome==='pass')award(CONFIG.pickups.gateScore,'GATE');else{resetCombo();popup('GATE MISSED','bad');}return debugSnapshot();},forceQualityStep:()=>{stepQuality();return debugSnapshot();}});
    window.__ALPINE_DEBUG__=debugApi;window.__ALPINE_CONFIG__=CONFIG;

    initialRiderPose();camera.position.set(rider.position.x+CONFIG.camera.menuRadius,rider.position.y+CONFIG.camera.menuHeight,rider.position.z);camera.lookAt(rider.position);resizeRendering();document.body.dataset.gameState='menu';
    try{renderer.compile(scene,camera);}catch(error){showError(error.stack||error.message);}

    let lastFrame=performance.now();
    function frame(now) {
      try{
        const frameMs=Math.min(100,Math.max(.1,now-lastFrame)),dt=Math.min(.05,frameMs/1000);lastFrame=now;
        if(state.mode==='RUNNING'||state.mode==='TUMBLING'){
          state.accumulator+=dt;let steps=0;while(state.accumulator>=CONFIG.physics.fixedStep&&steps<CONFIG.physics.maxSubsteps){physicsStep(CONFIG.physics.fixedStep);state.accumulator-=CONFIG.physics.fixedStep;steps++;}if(steps===CONFIG.physics.maxSubsteps)state.accumulator=0;
        }else state.time+=dt;
        updateRiderRig(dt);updateCamera(dt);updateWorldPresentation(dt);updateContactEffects(dt);updateHud(dt);renderPrepasses();updatePost();if(shadowDue){renderer.shadowMap.needsUpdate=true;shadowDue=false;}composer.render(dt);updateAdaptiveQuality(frameMs,dt);requestAnimationFrame(frame);
      }catch(error){showError(error.stack||error.message);state.paused=true;}
    }

    const autostart=new URLSearchParams(location.search).has('autostart');if(autostart)startRun(false);
    window.__ALPINE_READY__=Promise.resolve(true);dispatchEvent(new CustomEvent('alpine:ready'));requestAnimationFrame(frame);

  </script>
</body>
